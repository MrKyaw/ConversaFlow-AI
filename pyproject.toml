[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversaflow"
version = "1.0.0"
description = "Multi-turn conversational AI runtime with hybrid NLU, dialogue flows, agentic orchestration and built-in evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kyaw Kyawoo" }]
keywords = [
  "conversational-ai",
  "nlu",
  "dialogue-systems",
  "agentic-ai",
  "voice",
  "fastapi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
conversaflow = "conversaflow.cli:main"

[project.urls]
Homepage = "https://github.com/MrKyaw/ConversaFlow-AI"
Documentation = "https://github.com/MrKyaw/ConversaFlow-AI/tree/main/docs"
Issues = "https://github.com/MrKyaw/ConversaFlow-AI/issues"
Changelog = "https://github.com/MrKyaw/ConversaFlow-AI/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conversaflow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not perf'"
markers = [
  "e2e: spawns a real uvicorn process and talks HTTP",
  "perf: opt-in latency/throughput measurement",
  "property: randomized invariant tests",
]
filterwarnings = ["error", "ignore::starlette.exceptions.StarletteDeprecationWarning"]

[tool.coverage.run]
source = ["src/conversaflow"]
branch = true
omit = ["src/conversaflow/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]
ignore = ["B008", "RUF012", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src/conversaflow"]
strict = true
warn_unused_ignores = true
disallow_any_generics = false
