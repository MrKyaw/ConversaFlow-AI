services:
  conversaflow:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CONVERSAFLOW_API_KEYS: ${CONVERSAFLOW_API_KEYS:?Set CONVERSAFLOW_API_KEYS to private credentials}
      CONVERSAFLOW_STORE: sqlite
      CONVERSAFLOW_LOG_LEVEL: INFO
    volumes:
      - conversaflow-data:/app/var
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  conversaflow-data:
