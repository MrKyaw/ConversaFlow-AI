name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]' build
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src
      - run: python scripts/test_report.py
      - run: conversaflow eval --split test --json evaluation.json
      - name: Enforce bundled evaluation baseline
        run: |
          python - <<'PYTHON'
          import json
          report = json.load(open("evaluation.json"))
          assert report["intent"]["accuracy"] >= 0.90
          assert report["intent"]["macro_f1"] >= 0.90
          assert report["conversations"]["success_rate"] == 1.0
          PYTHON
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: validation-python-${{ matrix.python-version }}
          path: |
            docs/TEST_RESULTS.md
            evaluation.json
            dist/*

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t conversaflow:ci .
      - name: Run container smoke test
        shell: bash
        run: |
          docker run -d --name conversaflow -p 127.0.0.1:8000:8000 \
            -e CONVERSAFLOW_API_KEYS=ci-key:ci:admin conversaflow:ci
          trap 'docker logs conversaflow; docker rm -f conversaflow' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/v1/turns \
            -H 'Content-Type: application/json' -H 'X-API-Key: ci-key' \
            -d '{"text":"hello"}'
